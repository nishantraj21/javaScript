<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="./quizStyle.css">
<body>
    <div class="container">
        <h1>General Knowledge Quiz</h1>
        <form id="quizForm">
            <div class="question">
                <p>1. Who is known as Father of Genetics?</p>
                <label>
                    <input type="radio" name="q1" value="Arastu"> Arastu
                </label><br>
                <label>
                    <input type="radio" name="q1" value="Mendal"> Mendal
                </label><br>
                <label>
                    <input type="radio" name="q1" value="Lenin"> Lenin
                </label><br>
                <label>
                    <input type="radio" name="q1" value="Newton"> Newton
                </label>
            </div>
            <div class="question">
                <p>2. Which planet is known as Morning star?</p>
                <label>
                    <input type="radio" name="q2" value="Mars"> Mars
                </label><br>
                <label>
                    <input type="radio" name="q2" value="Jupiter"> Jupiter
                </label><br>
                <label>
                    <input type="radio" name="q2" value="Mercury"> Mercury
                </label><br>
                <label>
                    <input type="radio" name="q2" value="Venus"> Venus
                </label>
            </div>
            <div class="question">
                <p>3. Who is the first Prime Minister of India?</p>
                <label>
                    <input type="radio" name="q3" value="Nehru"> Pt. Nehru
                </label><br>
                <label>
                    <input type="radio" name="q3" value="Bose"> S.C. Bose
                </label><br>
                <label>
                    <input type="radio" name="q3" value="RadhaKrishanan"> Radha Krishanan
                </label><br>
                <label>
                    <input type="radio" name="q3" value="Prasad"> Dr. Rajendra Prasad
                </label>
            </div>
            <br><br>

            <button type="submit" style="width: 100px; background-color: aqua;">Submit</button>
            <br><br>

            <div id="result"></div>
        </form>
    </div>
    
</body>
<script src="./quizScript.js"></script>
</html>
